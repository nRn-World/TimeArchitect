<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Time Architect cover</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 512px; height: 512px; margin: 0; overflow: hidden; }
      body {
        background: #04070c;
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        color: #f4ead2;
        -webkit-font-smoothing: antialiased;
      }
      .cover {
        position: relative;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background:
          radial-gradient(120% 80% at 50% 6%, rgba(32, 65, 86, 0.55) 0%, rgba(6, 13, 21, 0) 62%),
          linear-gradient(180deg, #07111b 0%, #05090f 58%, #03060a 100%);
      }
      .rings {
        position: absolute;
        inset: -124px -124px auto -124px;
        height: 620px;
        opacity: 0.5;
        background: repeating-radial-gradient(circle at 50% 30%, rgba(133, 190, 210, 0.12) 0 1px, transparent 1px 54px);
        mask-image: radial-gradient(70% 60% at 50% 32%, #000 20%, transparent 78%);
      }
      .ticks {
        position: absolute;
        left: 50%;
        top: 186px;
        width: 380px;
        height: 380px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid rgba(255, 199, 107, 0.13);
        box-shadow: 0 0 60px rgba(111, 230, 255, 0.07) inset;
      }
      .ticks::before {
        content: "";
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        border: 1px dashed rgba(111, 230, 255, 0.14);
      }
      header {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 26px;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 199, 107, 0.28);
      }
      .kicker {
        margin: 14px 0 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 4.6px;
        color: #8fdcea;
        text-transform: uppercase;
      }
      h1 {
        margin: 7px 0 0;
        font-size: 51px;
        line-height: 0.94;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-align: center;
        text-transform: uppercase;
        background: linear-gradient(178deg, #fff7e4 4%, #ffd795 38%, #d99a45 72%, #9b6628 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.6));
      }
      h1 span { display: block; }
      h1 .second { font-size: 53px; letter-spacing: 5px; }
      .rule {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 8px;
        letter-spacing: 3.1px;
        color: #b9b09c;
        text-transform: uppercase;
      }
      .rule::before, .rule::after {
        content: "";
        width: 34px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 199, 107, 0.55));
      }
      .rule::after { transform: scaleX(-1); }
      .art {
        position: absolute;
        z-index: 1;
        left: -8%;
        right: -8%;
        bottom: -6%;
        height: 300px;
        overflow: hidden;
        mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 100%);
      }
      .art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 48% 41%;
        transform: scale(1.34);
        filter: saturate(1.06) contrast(1.04) brightness(1.16);
      }
      .art::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(80% 62% at 50% 54%, transparent 38%, rgba(4, 8, 13, 0.72) 100%),
          linear-gradient(180deg, rgba(4, 8, 13, 0.5) 0%, transparent 30%);
      }
      footer {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 7.5px;
        letter-spacing: 2.8px;
        color: #cfc7b6;
        text-transform: uppercase;
        background: linear-gradient(180deg, transparent, rgba(2, 5, 9, 0.92) 58%);
      }
      footer img { width: 25px; height: 25px; border-radius: 7px; }
      footer b { color: #ffd795; font-weight: 600; letter-spacing: 1.8px; }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="rings"></div>
      <div class="ticks"></div>
      <header>
        <img class="mark" src="../assets/icon.svg" alt="" />
        <p class="kicker">A clockwork puzzle</p>
        <h1><span>Time</span><span class="second">Architect</span></h1>
        <div class="rule">Every move moves time</div>
      </header>
      <div class="art"><img src="../screenshots/android-title.png" alt="" /></div>
      <footer><img src="../assets/brand/nrnworld-logo.webp" alt="" /> <span>by</span> <b>nRnWorld</b></footer>
    </div>
  </body>
</html>
